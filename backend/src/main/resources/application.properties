spring.application.name=locadora-api
server.port=8081

# H2 em arquivo, para os dados sobreviverem a reinicios do backend
spring.datasource.url=jdbc:h2:file:./data/locadora;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, util para inspecionar os dados em http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
