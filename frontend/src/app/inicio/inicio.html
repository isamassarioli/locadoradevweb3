<h1>Sistema Videolocadora</h1>
<p>Selecione o cadastro que deseja gerenciar:</p>

<div class="cartoes">
  <mat-card class="cartao">
    <mat-card-header>
      <mat-card-title>Atores</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Cadastro dos atores que atuam nos filmes da locadora.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button color="primary" routerLink="/atores">
        <mat-icon>theater_comedy</mat-icon> Abrir
      </a>
    </mat-card-actions>
  </mat-card>

  <mat-card class="cartao">
    <mat-card-header>
      <mat-card-title>Clientes</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Cadastro dos clientes da locadora.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button color="primary" routerLink="/clientes">
        <mat-icon>people</mat-icon> Abrir
      </a>
    </mat-card-actions>
  </mat-card>
</div>
