<mat-card>
  <mat-card-header>
    <mat-card-title>Cadastro de Clientes</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="topo">
      <a mat-flat-button color="primary" routerLink="/clientes/novo">
        <mat-icon>add</mat-icon> Novo Cliente
      </a>
    </div>

    <table mat-table [dataSource]="clientes()" class="tabela">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef>CPF</th>
        <td mat-cell *matCellDef="let c">{{ c.cpf }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let c">{{ c.tipo }}</td>
      </ng-container>

      <ng-container matColumnDef="comunicados">
        <th mat-header-cell *matHeaderCellDef>Comunicados</th>
        <td mat-cell *matCellDef="let c">{{ c.comunicados ? 'Sim' : 'Nao' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let c">
          <a mat-icon-button color="primary" [routerLink]="['/clientes', c.id, 'editar']" aria-label="Alterar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="excluir(c)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (clientes().length === 0) {
      <p class="vazio">Nenhum cliente cadastrado.</p>
    }
  </mat-card-content>
</mat-card>
