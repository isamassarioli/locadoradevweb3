<mat-card>
  <mat-card-header>
    <mat-card-title>Cadastro de Diretores</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="topo">
      <a mat-flat-button color="primary" routerLink="/diretores/novo">
        <mat-icon>add</mat-icon> Novo Diretor
      </a>
    </div>

    <table mat-table [dataSource]="diretores()" class="tabela">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let diretor">{{ diretor.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let diretor">{{ diretor.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let diretor">
          <a mat-icon-button color="primary" [routerLink]="['/diretores', diretor.id, 'editar']" aria-label="Alterar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="excluir(diretor)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (diretores().length === 0) {
      <p class="vazio">Nenhum diretor cadastrado.</p>
    }
  </mat-card-content>
</mat-card>
