<mat-card>
  <mat-card-header>
    <mat-card-title>{{ edicao() ? 'Alterar Diretor' : 'Novo Diretor' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="salvar()" class="formulario">
      <mat-form-field appearance="outline">
        <mat-label>Nome do Diretor</mat-label>
        <input matInput formControlName="nome" placeholder="Ex: Fernando Meirelles">
        @if (form.controls.nome.hasError('required')) {
          <mat-error>O nome e obrigatorio.</mat-error>
        }
      </mat-form-field>

      <div class="acoes">
        <button mat-flat-button color="primary" type="submit">Salvar</button>
        <a mat-button routerLink="/diretores">Cancelar</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
