<mat-card>
  <mat-card-header>
    <mat-card-title>Cadastro de Itens</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="topo">
      <a mat-flat-button color="primary" routerLink="/itens/novo">
        <mat-icon>add</mat-icon> Novo Item
      </a>
    </div>

    <table mat-table [dataSource]="itens()" class="tabela">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let item">{{ item.id }}</td>
      </ng-container>

      <ng-container matColumnDef="numSerie">
        <th mat-header-cell *matHeaderCellDef>Numero de serie</th>
        <td mat-cell *matCellDef="let item">{{ item.numSerie }}</td>
      </ng-container>

<ng-container matColumnDef="titulo"><th mat-header-cell *matHeaderCellDef>Titulo</th><td mat-cell *matCellDef="let item">{{ item.titulo.nome }}</td></ng-container>
<ng-container matColumnDef="tipoItem"><th mat-header-cell *matHeaderCellDef>Midia</th><td mat-cell *matCellDef="let item">{{ item.tipoItem }}</td></ng-container>
<ng-container matColumnDef="dataAquisicao"><th mat-header-cell *matHeaderCellDef>Aquisicao</th><td mat-cell *matCellDef="let item">{{ item.dataAquisicao }}</td></ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let item">
          <a mat-icon-button color="primary" [routerLink]="['/itens', item.id, 'editar']" aria-label="Alterar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="excluir(item)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (itens().length === 0) {
      <p class="vazio">Nenhum item cadastrado.</p>
    }
  </mat-card-content>
</mat-card>
