<mat-card>
  <mat-card-header>
    <mat-card-title>Cadastro de Titulos</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="topo">
      <a mat-flat-button color="primary" routerLink="/titulos/novo">
        <mat-icon>add</mat-icon> Novo Titulo
      </a>
    </div>

    <table mat-table [dataSource]="titulos()" class="tabela">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let titulo">{{ titulo.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let titulo">{{ titulo.nome }}</td>
      </ng-container>

<ng-container matColumnDef="ano"><th mat-header-cell *matHeaderCellDef>Ano</th><td mat-cell *matCellDef="let titulo">{{ titulo.ano }}</td></ng-container>
<ng-container matColumnDef="categoria"><th mat-header-cell *matHeaderCellDef>Categoria</th><td mat-cell *matCellDef="let titulo">{{ titulo.categoria }}</td></ng-container>
<ng-container matColumnDef="diretor"><th mat-header-cell *matHeaderCellDef>Diretor</th><td mat-cell *matCellDef="let titulo">{{ titulo.diretor.nome }}</td></ng-container>
<ng-container matColumnDef="classe"><th mat-header-cell *matHeaderCellDef>Classe</th><td mat-cell *matCellDef="let titulo">{{ titulo.classe.nome }}</td></ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let titulo">
          <a mat-icon-button color="primary" [routerLink]="['/titulos', titulo.id, 'editar']" aria-label="Alterar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="excluir(titulo)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (titulos().length === 0) {
      <p class="vazio">Nenhum titulo cadastrado.</p>
    }
  </mat-card-content>
</mat-card>
