<mat-card>
  <mat-card-header>
    <mat-card-title>{{ edicao() ? 'Alterar Classe' : 'Nova Classe' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="salvar()" class="formulario">
      <mat-form-field appearance="outline">
        <mat-label>Nome da Classe</mat-label>
        <input matInput formControlName="nome" placeholder="Ex: Wagner Moura">
        @if (form.controls.nome.hasError('required')) {
          <mat-error>O nome e obrigclasseio.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Valor (R$)</mat-label>
        <input matInput type="number" min="0.01" step="0.01" formControlName="valor">
        <mat-error>Informe um valor positivo.</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Prazo de devolucao (dias)</mat-label>
        <input matInput type="number" min="1" step="1" formControlName="prazoDevolucao">
        <mat-error>Informe um numero inteiro positivo de dias.</mat-error>
      </mat-form-field>
      <div class="acoes">
        <button mat-flat-button color="primary" type="submit">Salvar</button>
        <a mat-button routerLink="/classes">Cancelar</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
