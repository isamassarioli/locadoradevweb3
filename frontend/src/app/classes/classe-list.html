<mat-card>
  <mat-card-header>
    <mat-card-title>Cadastro de Classes</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="topo">
      <a mat-flat-button color="primary" routerLink="/classes/novo">
        <mat-icon>add</mat-icon> Nova Classe
      </a>
    </div>

    <table mat-table [dataSource]="classes()" class="tabela">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let classe">{{ classe.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let classe">{{ classe.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let classe">{{ classe.valor | currency: 'BRL' }}</td>
      </ng-container>

      <ng-container matColumnDef="prazoDevolucao">
        <th mat-header-cell *matHeaderCellDef>Prazo de Devolucao</th>
        <td mat-cell *matCellDef="let classe">{{ classe.prazoDevolucao }} dia(s)</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let classe">
          <a mat-icon-button color="primary" [routerLink]="['/classes', classe.id, 'editar']" aria-label="Alterar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="excluir(classe)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (classes().length === 0) {
      <p class="vazio">Nenhuma classe cadastrada.</p>
    }
  </mat-card-content>
</mat-card>
